services:
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    # Llama runs as a bare process on the host (not in Docker), reachable
    # via host.docker.internal — see DOCKER_DEPLOYMENT_SPEC.md phase 10.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/drills')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hydroflow

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hydroflow

networks:
  hydroflow:
    driver: bridge
